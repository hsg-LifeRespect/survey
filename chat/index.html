<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>구름이와 이야기하기 · 숨쉼</title>
<meta name="description" content="지금 마음을 골라 보면, 구름이가 쉬어 갈 방법과 도움받을 곳을 함께 찾아 드려요. 이름이나 연락처 없이 이용할 수 있어요.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../shared/common.css?v=20261119a">
<link rel="stylesheet" href="style.css?v=20261119a">
</head>
<body class="chat" data-bg="home">
<div class="shell">
  <header class="cbar">
    <button type="button" class="ib" id="back" aria-label="이전 화면" disabled>←</button>
    <div class="prog" aria-hidden="true"><i id="bar"></i></div>
    <button type="button" class="hb" id="helpBtn" aria-haspopup="dialog">도움받기</button>
    <a class="ib" id="close" href="../shim/?ref=chat-close" data-go="shim" data-from="chat-close" aria-label="대화 마치고 숨쉼으로 돌아가기">✕</a>
  </header>
  <main id="stage"></main>
  <p class="cfoot" id="foot"></p>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-t" hidden>
  <div class="sheet-in">
    <h2 id="sheet-t">도움받을 곳</h2>
    <p class="sheet-lead">어느 화면에서든 바로 연락할 수 있어요. 번호를 누르면 전화가 걸려요.</p>
    <div id="sheet-list"></div>
    <p class="sheet-small">이 대화에서 고른 답은 저장하거나 보내지 않아요.</p>
    <button type="button" class="btn primary" id="sheet-x">닫고 이어 가기</button>
  </div>
</div>

<noscript><p style="padding:16px">이 페이지는 자바스크립트가 필요합니다.</p></noscript>
<script src="../shared/config.js?v=20261119a"></script>
<script src="../shared/common.js?v=20261119a"></script>
<script src="script.js?v=20261119a"></script>
<script src="app.js?v=20261119a"></script>
</body>
</html>
