<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>구름마음 자가검진</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 하늘 위 구름 무대. 왼쪽 정렬 소개 + 오른쪽 구름 장식, 검진은 한 화면 한 문항 */
:root {
  --sky-top: #cfe8fb;
  --sky-bot: #f1f8fe;
  --bg: #eaf5fd;
  --card: #ffffff;
  --fg: #17324a;
  --muted: #5a7389;
  --line: #cfe0ee;
  --accent: #2f86d6;
  --accent-fg: #ffffff;
  --accent-soft: #dcecfb;
  --cloud: #ffffff;
  --warn-bg: #fff3df;
  --warn-fg: #6b4300;
  --warn-line: #f0cf95;
  --f-display: "Gowun Dodum", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky-top: #0f2238; --sky-bot: #14293f; --bg: #10253a; --card: #19324a;
    --fg: #e6f0f9; --muted: #9db4c8; --line: #2b4863; --accent: #6bb4f5;
    --accent-fg: #0b1d2f; --accent-soft: #223f5a; --cloud: #2a4a68;
    --warn-bg: #3a2f1a; --warn-fg: #f3d9a4; --warn-line: #6b5326;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky-top: #0f2238; --sky-bot: #14293f; --bg: #10253a; --card: #19324a;
  --fg: #e6f0f9; --muted: #9db4c8; --line: #2b4863; --accent: #6bb4f5;
  --accent-fg: #0b1d2f; --accent-soft: #223f5a; --cloud: #2a4a68;
  --warn-bg: #3a2f1a; --warn-fg: #f3d9a4; --warn-line: #6b5326;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  background-image: linear-gradient(180deg, var(--sky-top) 0, var(--sky-bot) 520px);
  background-repeat: no-repeat;
  color: var(--fg);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.7;
  word-break: keep-all;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
  overflow-x: hidden;
}
.wrap { max-width: 880px; margin: 0 auto; position: relative; z-index: 1; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; margin: 0; text-wrap: balance; line-height: 1.3; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* clouds */
.sky { position: absolute; inset: 0 0 auto 0; height: 560px; overflow: hidden; pointer-events: none; z-index: 0; }
.cloud { position: absolute; width: 180px; height: 54px; background: var(--cloud); border-radius: 60px; opacity: .9; animation: drift 60s linear infinite; }
.cloud::before, .cloud::after { content: ""; position: absolute; background: var(--cloud); border-radius: 50%; }
.cloud::before { width: 80px; height: 80px; left: 24px; top: -38px; }
.cloud::after { width: 58px; height: 58px; right: 28px; top: -26px; }
.c1 { top: 70px; left: -200px; animation-duration: 90s; }
.c2 { top: 200px; left: -200px; transform: scale(.62); animation-duration: 120s; animation-delay: -50s; opacity: .7; }
.c3 { top: 340px; left: -200px; transform: scale(1.2); animation-duration: 150s; animation-delay: -90s; opacity: .55; }
@keyframes drift { to { translate: calc(100vw + 420px) 0; } }
@media (prefers-reduced-motion: reduce) { .cloud { animation: none; left: 60%; } .c2 { left: 10%; } .c3 { left: 35%; } }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: inline-flex; align-items: center; gap: 10px; font-family: var(--f-display); font-size: 1.25rem; text-decoration: none; color: var(--fg); background: none; border: 0; padding: 6px 0; }
.brand i { width: 34px; height: 22px; background: var(--accent); border-radius: 14px; position: relative; display: inline-block; }
.brand i::before { content: ""; position: absolute; width: 17px; height: 17px; border-radius: 50%; background: var(--accent); left: 5px; top: -8px; }
.brand i::after { content: ""; position: absolute; width: 13px; height: 13px; border-radius: 50%; background: var(--accent); right: 5px; top: -5px; }
.help-link { font-size: .9rem; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; text-decoration: none; }

/* home */
.hero { padding: 56px 0 36px; max-width: 560px; }
.eyebrow { font-size: .85rem; letter-spacing: .08em; color: var(--accent); font-weight: 700; margin-bottom: 10px; }
.hero h1 { font-size: clamp(2rem, 7vw, 3.1rem); margin-bottom: 16px; }
.hero p { color: var(--muted); font-size: 1.05rem; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
.facts span { font-size: .85rem; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; color: var(--muted); }

.tests { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-top: 8px; }
.test-card { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 22px 20px 20px; display: flex; flex-direction: column; gap: 10px; min-width: 0; transition: transform .15s, border-color .15s; }
.test-card:hover { transform: translateY(-3px); border-color: var(--accent); }
.test-card .tag { font-size: .8rem; color: var(--accent); font-weight: 700; letter-spacing: .04em; }
.test-card h2 { font-size: 1.45rem; }
.test-card p { color: var(--muted); font-size: .95rem; flex: 1; }
.test-card .meta { font-size: .85rem; color: var(--muted); display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
.test-card .go { background: var(--accent); color: var(--accent-fg); border-radius: 999px; padding: 6px 16px; font-weight: 700; font-size: .9rem; }

.notice { margin-top: 28px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; color: var(--muted); font-size: .92rem; display: grid; gap: 6px; }
.notice b { color: var(--fg); }

/* quiz */
.panel { margin-top: 36px; background: var(--card); border: 1px solid var(--line); border-radius: 26px; padding: clamp(20px, 5vw, 36px); max-width: 680px; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.panel-head h2 { font-size: 1.3rem; }
.count { font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 10px; background: var(--accent-soft); border-radius: 999px; overflow: hidden; margin-bottom: 26px; }
.bar > div { height: 100%; background: var(--accent); border-radius: 999px; transition: width .3s; }
.period { font-size: .85rem; color: var(--muted); margin-bottom: 6px; }
.q { font-family: var(--f-display); font-size: clamp(1.3rem, 4.6vw, 1.7rem); line-height: 1.5; margin-bottom: 22px; min-height: 3.2em; }
.opts { display: grid; gap: 10px; }
.opt { text-align: left; background: var(--bg); border: 2px solid var(--line); border-radius: 16px; padding: 13px 16px; font-size: 1rem; width: 100%; transition: border-color .12s, background .12s; }
.opt:hover { border-color: var(--accent); }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 22px; }
.btn { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 9px 20px; color: var(--fg); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 700; }
.btn[disabled] { opacity: .4; cursor: default; }

/* result */
.score-row { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin: 6px 0 14px; }
.score { font-family: var(--f-display); font-size: 3.6rem; line-height: 1; font-variant-numeric: tabular-nums; }
.score small { font-size: 1.2rem; color: var(--muted); }
.level { background: var(--accent-soft); color: var(--fg); border-radius: 999px; padding: 4px 16px; font-weight: 700; }
.scale { display: flex; gap: 4px; margin: 18px 0 8px; }
.scale div { flex: 1; height: 12px; border-radius: 6px; background: var(--accent-soft); min-width: 0; }
.scale div.on { background: var(--accent); }
.scale-labels { display: flex; gap: 4px; font-size: .72rem; color: var(--muted); }
.scale-labels span { flex: 1; text-align: center; min-width: 0; }
.advice { margin-top: 18px; color: var(--fg); }
.crisis { margin-top: 20px; background: var(--warn-bg); color: var(--warn-fg); border: 1px solid var(--warn-line); border-radius: 18px; padding: 16px 18px; font-size: .95rem; display: grid; gap: 4px; }
.crisis b { font-size: 1.02rem; }
.crisis .num { font-variant-numeric: tabular-nums; font-weight: 700; }
.result-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }

footer { margin-top: 44px; font-size: .85rem; color: var(--muted); max-width: 680px; display: grid; gap: 6px; }
#help { margin-top: 28px; }
</style>
</head>
<body><div class="sky" aria-hidden="true"><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div></div>

<div class="wrap">
  <header class="top">
    <button class="brand" id="brand" type="button"><i aria-hidden="true"></i>구름마음</button>
    <a class="help-link" href="#help" id="helpLink">도움 받을 곳</a>
  </header>

  <main id="app"></main>

  <section id="help" aria-label="도움 받을 곳">
    <div class="crisis">
      <b>지금 많이 힘들다면 혼자 견디지 마세요</b>
      <span>자살예방상담전화 <span class="num">109</span> (24시간, 무료)</span>
      <span>정신건강위기상담전화 <span class="num">1577-0199</span> (24시간)</span>
      <span>횡성군 정신건강복지센터 <span class="num">033-345-9901</span> (주간)</span>
      <span>생명이 위험한 응급 상황에는 <span class="num">119</span></span>
    </div>
  </section>

  <footer>
    <p>이 검진은 마음 상태를 가늠해 보는 참고용 선별 도구이며, 의학적 진단이 아닙니다. 점수와 관계없이 불편이 이어지면 정신건강의학과나 지역 정신건강복지센터와 상담해 보세요.</p>
    <p>입력한 답변은 이 화면 안에서만 계산되고, 어디에도 저장되거나 전송되지 않습니다.</p>
  </footer>
</div>

<script>
var FREQ4 = ["전혀 없었다", "며칠 동안 있었다", "일주일 이상 있었다", "거의 매일 있었다"];
var FREQ6 = ["전혀 아니었다", "가끔 그랬다", "절반 이하로 그랬다", "절반 이상 그랬다", "대부분 그랬다", "항상 그랬다"];

var TESTS = {

    desc: "가라앉은 기분, 흥미 저하, 수면과 식욕 변화 등 우울과 관련된 9가지 모습을 살펴봅니다.",

      { to: 19, name: "다소 심한 수준", text: "우울 증상이 꽤 뚜렷합니다. 혼자 버티기보다 가까운 시일 안에 정신건강의학과 진료나 전문 상담을 받아 보세요." },
      { to: 27, name: "심한 수준", text: "우울 증상이 많이 심한 상태일 수 있습니다. 되도록 빨리 정신건강의학과 진료를 받아 보시길 강하게 권합니다. 주변 사람에게 지금 상태를 알리는 것도 큰 도움이 됩니다." }

    desc: "초조함, 지나친 걱정, 쉬기 어려움 등 불안과 관련된 7가지 모습을 살펴봅니다.",
    opts: FREQ4, max: 21, minutes: 2,
    items: [

var ORDER = ["phq9", "gad7", "who5"];

var app = document.getElementById("app");
var state = { id: null, i: 0, ans: [] };

function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); }

function renderHome() {
  state = { id: null, i: 0, ans: [] };
  var cards = ORDER.map(function (id) {
    var t = TESTS[id];
    return '<button class="test-card" type="button" data-test="' + id + '">' +
      '<span class="tag">' + t.tag + " · " + t.sub + "</span>" +

  app.innerHTML =
    '<section class="hero"><p class="eyebrow">마음건강 자가검진</p>' +
    "<h1>구름처럼 가볍게,<br>내 마음을 살펴보세요</h1>" +
    "<p>몇 가지 질문에 답하면 요즘 마음 상태를 참고할 수 있는 결과를 바로 알려 드립니다. 이름이나 연락처는 묻지 않습니다.</p>" +
    '<div class="facts"><span>회원가입 없음</span><span>개인정보 수집 없음</span><span>1~3분 소요</span></div></section>' +
    '<section class="tests" aria-label="검진 선택">' + cards + "</section>" +
    '<div class="notice"><p><b>이렇게 답해 주세요</b></p><p>생각을 오래 하기보다, 지난 2주 동안의 내 모습에 가장 가까운 답을 골라 주세요. 맞고 틀린 답은 없습니다.</p></div>';
  window.scrollTo(0, 0);
}

function renderQuestion() {
  var t = TESTS[state.id], n = t.items.length, sel = state.ans[state.i];
  var opts = t.opts.map(function (label, v) {
    return '<button class="opt" type="button" data-v="' + v + '" aria-pressed="' + (sel === v) + '">' + esc(label) + "</button>";
  }).join("");
  app.innerHTML =
    '<section class="panel" aria-live="polite"><div class="panel-head"><h2>' + t.name + '</h2><span class="count">' + (state.i + 1) + " / " + n + "</span></div>" +
    '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + n + '" aria-valuenow="' + state.i + '"><div style="width:' + (state.i / n * 100) + '%"></div></div>' +
    '<p class="period">' + t.period + "</p>" +
    '<p class="q">' + esc(t.items[state.i]) + "</p>" +
    '<div class="opts">' + opts + "</div>" +
    '<div class="nav"><button class="btn" type="button" id="prev">' + (state.i === 0 ? "처음으로" : "이전") + "</button>" +
    '<button class="btn primary" type="button" id="next"' + (sel === undefined ? " disabled" : "") + ">" + (state.i === n - 1 ? "결과 보기" : "다음") + "</button></div></section>";
}

function renderResult() {
  var t = TESTS[state.id];
  var raw = state.ans.reduce(function (a, b) { return a + b; }, 0);
  var shown = t.percent ? raw * 4 : raw;
  var lvIdx = 0;
  for (var k = 0; k < t.levels.length; k++) { if (shown <= t.levels[k].to) { lvIdx = k; break; } lvIdx = k; }
  var lv = t.levels[lvIdx];
  var unit = t.percent ? "/ 100" : "/ " + t.max;
  var segs = t.levels.map(function (_, j) { return '<div class="' + (j <= lvIdx ? "on" : "") + '"></div>'; }).join("");
  var labs = t.levels.map(function (l) { return "<span>" + l.name + "</span>"; }).join("");
  var risk = t.risk !== undefined && state.ans[t.risk] > 0;
  var riskBox = risk ?
    '<div class="crisis"><b>마지막 문항에 응답하신 내용이 마음에 걸립니다</b><span>죽고 싶거나 스스로를 해치고 싶은 생각이 든다면, 점수와 상관없이 지금 바로 누군가에게 알려 주세요.</span><span>자살예방상담전화 <span class="num">109</span> (24시간, 무료)</span><span>정신건강위기상담전화 <span class="num">1577-0199</span></span><span>횡성군 정신건강복지센터 <span class="num">033-345-9901</span> (주간)</span><span>지금 위험하다고 느껴지면 <span class="num">119</span></span></div>' : "";
  var others = ORDER.filter(function (x) { return x !== state.id; }).map(function (x) {
    return '<button class="btn" type="button" data-test="' + x + '">' + TESTS[x].name + "</button>";
  }).join("");
  app.innerHTML =
    '<section class="panel"><div class="panel-head"><h2>' + t.name + ' 결과</h2><span class="count">' + t.sub + "</span></div>" +
    '<div class="score-row"><span class="score">' + shown + " <small>" + unit + '</small></span><span class="level">' + lv.name + "</span></div>" +
    '<div class="scale" aria-hidden="true">' + segs + '</div><div class="scale-labels" aria-hidden="true">' + labs + "</div>" +
    '<p class="advice">' + lv.text + "</p>" + riskBox +
    '<div class="result-actions"><button class="btn primary" type="button" id="again">다시 하기</button><button class="btn" type="button" id="homeBtn">검진 목록</button>' + others + "</div></section>";
  window.scrollTo(0, 0);
}

function start(id) {
  state = { id: id, i: 0, ans: [] };
  renderQuestion();
  window.scrollTo(0, 0);
}

app.addEventListener("click", function (e) {
  var el = e.target.closest("button");
  if (!el) return;
  if (el.dataset.test) { location.hash = el.dataset.test; return; }
  if (el.id === "again") { start(state.id); return; }
  if (el.id === "homeBtn") { location.hash = "home"; return; }
  if (!state.id) return;
  var n = TESTS[state.id].items.length;
  if (el.classList.contains("opt")) {
    state.ans[state.i] = Number(el.dataset.v);
    var last = state.i === n - 1;
    if (!last) { renderQuestion(); setTimeout(function () { state.i++; renderQuestion(); }, 180); }
    else { renderQuestion(); }
  } else if (el.id === "next") {
    if (state.ans[state.i] === undefined) return;
    if (state.i === n - 1) renderResult(); else { state.i++; renderQuestion(); }
  } else if (el.id === "prev") {
    if (state.i === 0) location.hash = "home"; else { state.i--; renderQuestion(); }
  }
});

document.getElementById("brand").addEventListener("click", function () {
  if (location.hash === "#home" || location.hash === "") renderHome(); else location.hash = "home";
});
document.getElementById("helpLink").addEventListener("click", function (e) {
  e.preventDefault();
  document.getElementById("help").scrollIntoView({ behavior: "smooth" });
});

function route() {
  var h = location.hash.replace("#", "");
  if (TESTS[h]) start(h); else renderHome();
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
